<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0f2e">
<title>Turbo do José</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Corrida de carrinho para o José (6 anos): o carro acelera sozinho, ele só vira. */
  :root{--tinta:#fff;--fundo:#1a0f2e;--vermelho:#ff3b3b;--amarelo:#ffd23f;--azul:#2d9cff;--verde:#38d67a;--cartao:rgba(26,15,46,.9);
    --letra:Fredoka,"Trebuchet MS",system-ui,sans-serif;color-scheme:dark}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--fundo);overflow:hidden;font-family:var(--letra);color:var(--tinta);user-select:none;-webkit-user-select:none;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ov{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
    background:radial-gradient(120% 80% at 50% 0%,rgba(255,210,63,.18),transparent 60%),rgba(16,8,30,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  .ov[hidden]{display:none}
  #menu{background:radial-gradient(90% 70% at 50% 0%,rgba(255,210,63,.35),transparent 60%),linear-gradient(180deg,rgba(45,156,255,.55),rgba(255,95,162,.45))}
  #menu .cartao{background:linear-gradient(180deg,rgba(40,20,80,.94),rgba(26,15,46,.95))}
  .cartao{width:min(880px,100%);max-height:100%;overflow:auto;background:var(--cartao);border:3px solid rgba(255,255,255,.14);border-radius:26px;padding:clamp(12px,2.5vmin,22px);box-shadow:0 18px 50px rgba(0,0,0,.5);scrollbar-width:thin}
  h1{margin:0;text-align:center;font-weight:700;font-size:clamp(2rem,7vmin,3.6rem);line-height:1;letter-spacing:.02em;
    background:repeating-linear-gradient(90deg,#fff 0 14px,#111 14px 28px) 0 100%/100% 6px no-repeat,linear-gradient(180deg,#ffe066,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 3px 0 #7a1d00) drop-shadow(0 0 18px rgba(255,138,31,.45));animation:balanca 2.4s ease-in-out infinite}
  @keyframes balanca{0%,100%{transform:rotate(-2deg) scale(1)}50%{transform:rotate(2deg) scale(1.04)}}
  .sub{margin:4px 0 12px;text-align:center;color:#ffd9a6;font-size:clamp(.9rem,2.4vmin,1.05rem)}
  h2{margin:12px 0 8px;font-size:1rem;font-weight:600;color:#ffd23f;letter-spacing:.06em;text-transform:uppercase}
  .grade{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,128px),1fr))}
  .escolha{font:inherit;color:inherit;cursor:pointer;border:3px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);border-radius:18px;padding:8px 6px 10px;display:grid;justify-items:center;gap:4px;text-align:center;transition:transform .12s,border-color .12s,background .12s}
  .escolha img{width:100%;max-width:120px;aspect-ratio:1.6;object-fit:contain}
  .escolha .ic{font-size:2.2rem;line-height:1.2}
  .escolha b{font-weight:600;font-size:.95rem;line-height:1.15}
  .escolha small{color:#cbb8ee;font-size:.78rem}
  .escolha:hover{transform:translateY(-2px)}
  .escolha[aria-pressed="true"]{border-color:var(--amarelo);background:rgba(255,210,63,.18);box-shadow:0 0 0 4px rgba(255,210,63,.3),0 8px 20px rgba(0,0,0,.3)}
  .escolha[aria-pressed="true"] img,.escolha[aria-pressed="true"] .ic{animation:pula .6s ease-in-out infinite alternate}
  .escolha[aria-pressed="true"] b::before{content:"✔ ";color:var(--amarelo)}
  @keyframes pula{to{transform:translateY(-6px) rotate(-2deg)}}
  .escolha.pista{background:var(--fundo-pista);border-color:rgba(255,255,255,.25)}
  .escolha.pista b{text-shadow:0 2px 0 rgba(0,0,0,.45)}
  .escolha.pista small{color:#fff;opacity:.9;text-shadow:0 1px 0 rgba(0,0,0,.5)}
  .escolha:focus-visible{outline:3px solid #fff;outline-offset:2px}
  .acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
  .btn{flex:1 1 160px;font:inherit;font-weight:700;font-size:1.25rem;border:0;border-radius:18px;padding:14px 18px;cursor:pointer;color:#3a1600;
    background:linear-gradient(180deg,#ffe066,#ff9a1f);box-shadow:0 6px 0 #b34f00,0 10px 20px rgba(0,0,0,.35);transition:transform .08s}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b34f00}
  .btn.cinza{background:linear-gradient(180deg,#e7e2f5,#b9b0d6);color:#2a1f45;box-shadow:0 6px 0 #6b6290,0 10px 20px rgba(0,0,0,.3);font-size:1rem}
  .btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
  .linguas{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
  .lingua{font:inherit;font-weight:600;font-size:.95rem;color:#fff;cursor:pointer;border:3px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);border-radius:99px;padding:6px 14px}
  .lingua[aria-pressed="true"]{border-color:var(--amarelo);background:rgba(255,210,63,.22)}
  .dica{margin:6px 0 0;color:#cbb8ee;font-size:.9rem;text-align:center}
  .dica:empty{display:none}
  .grade.gente{grid-template-columns:repeat(auto-fill,minmax(min(100%,92px),1fr))}
  .grade.gente:empty,h2:empty{display:none}
  #quemBox[hidden]{display:none}
  .codigo{font-size:clamp(2.6rem,12vmin,4rem);font-weight:700;letter-spacing:.3em;color:var(--amarelo);margin:6px 0;text-shadow:0 3px 0 #7a1d00}
  input.cod{font:inherit;font-size:2.2rem;font-weight:700;letter-spacing:.3em;text-transform:uppercase;text-align:center;width:100%;padding:10px;border-radius:16px;border:3px solid var(--amarelo);background:rgba(0,0,0,.3);color:#fff;outline:none}
  .gira{display:inline-block;width:22px;height:22px;border:4px solid rgba(255,255,255,.25);border-top-color:var(--amarelo);border-radius:50%;animation:gira .8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes gira{to{transform:rotate(1turn)}}
  a.volta{color:#cbb8ee;font-size:.9rem;text-decoration:none;display:inline-block;margin-top:12px}

  #hud{position:fixed;z-index:3;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 8px) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
  #hud[hidden]{display:none}
  .caixa{background:rgba(16,8,30,.62);border:2px solid rgba(255,255,255,.18);border-radius:16px;padding:6px 12px;font-weight:700;line-height:1.1;text-shadow:0 2px 0 rgba(0,0,0,.4)}
  #pos{font-size:clamp(1.8rem,7vmin,3rem);color:var(--amarelo)}
  #pos small{font-size:.45em;color:#fff}
  .meio{display:grid;gap:6px;justify-items:center}
  #barra{width:min(40vw,320px);height:12px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;border:2px solid rgba(255,255,255,.25)}
  #barra i{display:block;height:100%;width:0;background:linear-gradient(90deg,#38d67a,#ffd23f)}
  #vel{text-align:right;font-size:clamp(1.2rem,4.4vmin,1.9rem)}
  #vel small{display:block;font-size:.55em;color:#cbb8ee}
  #controles,#dupla{position:fixed;z-index:3;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;gap:10px;pointer-events:none;
    padding:0 max(12px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) max(12px,env(safe-area-inset-left))}
  #controles[hidden],#dupla[hidden]{display:none}
  .lado{display:flex;gap:10px;align-items:flex-end}
  .tecla{pointer-events:auto;width:clamp(74px,17vmin,120px);aspect-ratio:1;border-radius:50%;border:4px solid rgba(255,255,255,.55);background:rgba(16,8,30,.45);color:#fff;font-size:clamp(2rem,8vmin,3.4rem);font-weight:700;display:grid;place-items:center;touch-action:none;cursor:pointer}
  .tecla[hidden]{display:none}
  .tecla.bolha{width:clamp(64px,14vmin,96px);font-size:clamp(1.8rem,6.5vmin,2.8rem);border-color:#9fe7ff;background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(80,190,255,.35) 60%,rgba(255,95,162,.35));box-shadow:0 0 18px rgba(120,220,255,.5)}
  .tecla.bolha.recarga{opacity:.45;box-shadow:none}
  #dupla .tecla{width:clamp(58px,12vmin,92px);font-size:clamp(1.6rem,6vmin,2.6rem)}
  .tecla.ativa{background:rgba(255,210,63,.55);transform:scale(.94)}
  .tecla.pequena{width:clamp(54px,12vmin,78px);font-size:clamp(1.4rem,5vmin,2rem)}
  #pausa{position:fixed;z-index:4;top:calc(env(safe-area-inset-top) + 74px);right:max(10px,env(safe-area-inset-right));pointer-events:auto;border:2px solid rgba(255,255,255,.3);background:rgba(16,8,30,.55);color:#fff;border-radius:12px;width:44px;height:44px;font-size:1.1rem;cursor:pointer}
  #pausa[hidden]{display:none}
  .podio{display:grid;gap:6px;margin:10px 0}
  .linha{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.06);font-weight:600}
  .linha.eu{background:rgba(255,210,63,.2);border:2px solid var(--amarelo)}
  .linha .bola{width:18px;height:18px;border-radius:50%}
  .grande{text-align:center;font-size:clamp(2.4rem,10vmin,4.4rem);font-weight:700;line-height:1;margin:4px 0}
  @media (max-height:500px){.grande{font-size:2.2rem}.podio{gap:4px;margin:6px 0}.linha{padding:3px 10px}.acoes{margin-top:8px}.btn{padding:10px 14px;font-size:1.05rem}#fim .sub{margin:2px 0 4px}}
  /* fim da corrida: a festa aparece no fundo e o ranking fica num painel do lado (ou embaixo, com o celular em pé) */
  #fim{background:none;-webkit-backdrop-filter:none;backdrop-filter:none;justify-content:flex-end;align-items:center}
  #fimCartao{width:min(44vw,440px);max-height:100%;background:rgba(26,15,46,.86)}
  @media (orientation:portrait){#fim{align-items:flex-end;justify-content:center}#fimCartao{width:100%;max-height:50vh}}
  #fimCartao .grande{font-size:clamp(1.8rem,7vmin,3rem)}
  #fimCartao .btn{flex:1 1 120px;font-size:1rem;padding:11px 12px;white-space:nowrap}
  .taca{margin:4px 0;text-align:center;font-weight:700;color:var(--amarelo);font-size:1.05rem}
  .tacas{margin:4px 0 0;text-align:center;font-weight:600;color:#ffe9a8}
  .tacas:empty{display:none}
  .tabela{display:grid;gap:4px;margin:8px 0}
  .tabela .linha{grid-template-columns:auto auto 1fr auto}
  .tabela .pts{font-weight:700;color:var(--amarelo)}
  .tabela .mais{color:#7dff9a;font-size:.8em;margin-left:6px}
  h3.copa{margin:10px 0 4px;text-align:center;color:#ffd23f;font-size:1rem}
  #tituloPista[hidden],#pistas[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){.escolha,.btn{transition:none}h1,.escolha img,.escolha .ic{animation:none!important}}
</style>
</head>
<body>
<canvas id="c" aria-label="Pista de corrida"></canvas>

<div id="hud" hidden>
  <div class="caixa" id="pos">1º<small> / 6</small></div>
  <div class="meio"><div class="caixa" id="volta">Volta 1/2 · 🪙 0</div><div id="barra"><i></i></div></div>
  <div class="caixa" id="vel">0<small>km/h</small></div>
</div>
<button id="pausa" hidden aria-label="Pausar">⏸</button>
<div id="controles" hidden>
  <div class="lado"><button class="tecla" id="esq" aria-label="Virar para a esquerda">◀</button><button class="tecla pequena" id="buzina" aria-label="Buzinar">📯</button></div>
  <div class="lado"><button class="tecla pequena" id="sirene" aria-label="Ligar a sirene" hidden>🚨</button><button class="tecla bolha" id="tiro" aria-label="Jogar bolha mágica">🫧</button><button class="tecla" id="dir" aria-label="Virar para a direita">▶</button></div>
</div>
<div id="dupla" hidden>
  <div class="lado"><button class="tecla" id="p1esq" aria-label="Piloto 1 vira para a esquerda">◀</button><button class="tecla" id="p1dir" aria-label="Piloto 1 vira para a direita">▶</button><button class="tecla bolha" id="p1tiro" aria-label="Piloto 1 joga bolha">🫧</button></div>
  <div class="lado"><button class="tecla bolha" id="p2tiro" aria-label="Piloto 2 joga bolha">🫧</button><button class="tecla" id="p2esq" aria-label="Piloto 2 vira para a esquerda">◀</button><button class="tecla" id="p2dir" aria-label="Piloto 2 vira para a direita">▶</button></div>
</div>

<div class="ov" id="menu">
  <div class="cartao">
    <div class="linguas"><button class="lingua" data-l="pt">🇧🇷 Português</button><button class="lingua" data-l="fi">🇫🇮 Suomi</button></div>
    <h1 data-t="titulo">Turbo do José</h1>
    <p class="tacas" id="tacas"></p>
    <p class="sub" data-t="sub"></p>
    <h2 data-t="comoJogar"></h2>
    <div class="grade" id="modos"></div>
    <p class="dica" id="dicaModo"></p>
    <div id="quemBox"><h2 id="quemTit"></h2><div class="grade gente" id="quem"></div><h2 id="quem2Tit"></h2><div class="grade gente" id="quem2"></div></div>
    <h2 data-t="escolhaCarro"></h2>
    <div class="grade" id="carros"></div>
    <h2 data-t="dificuldade"></h2>
    <div class="grade" id="difs"></div>
    <h2 data-t="tipoCorrida"></h2>
    <div class="grade" id="tipos"></div>
    <h2 data-t="escolhaPista" id="tituloPista"></h2>
    <div class="grade" id="pistas"></div>
    <p class="dica" id="dicaCopa"></p>
    <div class="acoes">
      <button class="btn" id="correr"></button>
      <button class="btn" id="entrar" hidden></button>
      <button class="btn cinza" id="som" style="flex:0 1 140px">🔊 Som</button>
    </div>
    <a class="volta" href="index.html" data-t="galaxia"></a>
  </div>
</div>

<div class="ov" id="fim" hidden>
  <div class="cartao" id="fimCartao">
    <div class="grande" id="lugar">🏆 1º lugar!</div>
    <p class="taca" id="taca"></p>
    <p class="sub" id="frase"></p>
    <div id="classif"></div>
    <div class="podio" id="podio"></div>
    <div class="acoes">
      <button class="btn" id="denovo" data-t="denovo"></button>
      <button class="btn cinza" id="outra" data-t="outra"></button>
    </div>
  </div>
</div>

<div class="ov" id="sala" hidden>
  <div class="cartao" style="max-width:460px;text-align:center" id="salaCartao"></div>
</div>

<div class="ov" id="pausado" hidden>
  <div class="cartao" style="max-width:420px;text-align:center">
    <div class="grande">⏸</div>
    <div class="acoes"><button class="btn" id="continuar" data-t="continuar"></button><button class="btn cinza" id="sair" data-t="menu"></button></div>
  </div>
</div>

<script src="lib/peerjs.min.js"></script>
<script>
'use strict';
// =====================================================================
//  Turbo do José — corrida em pseudo-3D (estrada com curvas e morros)
// =====================================================================
const cv = document.getElementById('c'), ctxTela = cv.getContext('2d');
let ctx = ctxTela;
let W = 0, H = 0, DPR = 1;
function medir() {
  DPR = Math.min(devicePixelRatio || 1, 1.5);
  W = Math.round(innerWidth * DPR); H = Math.round(innerHeight * DPR);
  cv.width = W; cv.height = H;
}
addEventListener('resize', medir); medir();

const lim = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = n => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };
const interp = (a, b, p) => a + (b - a) * p;
const easeIn = (a, b, p) => a + (b - a) * p * p;
const easeInOut = (a, b, p) => a + (b - a) * (-Math.cos(p * Math.PI) / 2 + .5);
const mod = (v, m) => ((v % m) + m) % m;
function sobrepoe(x1, w1, x2, w2, pct = 1) { const h = pct / 2; return !(x1 + w1 * h < x2 - w2 * h || x1 - w1 * h > x2 + w2 * h); }

let salvo = { dif: 'medio', tipo: 'rapida', copas: {}, tacas: { ouro: 0, prata: 0, bronze: 0 }, carro: 'corrida', pista: 'sertao', som: true, trofeus: {}, modo: 'solo', eu: 'jose', eu2: 'gabi', lingua: /^fi/i.test(navigator.language || '') ? 'fi' : 'pt' };
try { salvo = { ...salvo, ...JSON.parse(localStorage.getItem('turboJose') || '{}') }; } catch {}
const guardar = () => { try { localStorage.setItem('turboJose', JSON.stringify(salvo)); } catch {} };

// ---------------- textos em português e finlandês ----------------
const TXT = {
  pt: {
    titulo: 'Turbo do José', sub: '🏎️ Corrida da família: José, Gabi, Madrinha, Keka, Emiel, Vovó e até o Ilo! O carro acelera sozinho: é só virar ◀ ▶, pegar as moedas 🪙 e jogar bolhas mágicas 🫧 nos outros carros para passar na frente!',
    escolhaCarro: '3. Escolha o carro', escolhaPista: '6. Escolha a pista', dificuldade: '4. Dificuldade', tipoCorrida: '5. Corrida ou campeonato?', correr: '🏁 CORRER!', som: '🔊 Som', semSom: '🔇 Sem som',
    galaxia: '⬅ Galáxia da Gabi', denovo: '🔁 Correr de novo', outra: '🗺️ Outra pista', continuar: '▶ Continuar', menu: '🗺️ Menu',
    sirene: 'tem sirene!', semTrofeu: 'ainda sem troféu', trofeu: ['🏆 campeão', '🥈 2º lugar', '🥉 3º lugar'], melhor: n => `melhor: ${n}º`,
    ord: n => `${n}º`, volta: (a, b) => `Volta ${a}/${b}`, prepare: 'Prepare-se!', vai: 'VAI!', chegada: 'CHEGADA!',
    ultima: 'Última volta! 🏁', passou: c => `Passou ${c.pt}! 🎉`, lugar: n => `${n}º lugar!`,
    frases: { 1: 'Você ganhou a corrida, José! Campeão!', 2: 'Quase! Segundo lugar, muito bem!', 3: 'Terceiro lugar! Subiu no pódio!' },
    fraseOutra: 'Você terminou a corrida! Bora tentar de novo?', moedas: n => `🪙 ${n} moedas.`,
    falaVai: 'Vai, José!', falaCampeao: 'Parabéns, José! Você é o campeão!', falaLugar: n => `Parabéns, José! ${n}º lugar!`, voz: 'pt-BR',
    policia: 'POLÍCIA', taxi: 'TÁXI',
    taca: ['Você ganhou a TAÇA DE OURO! 🏆', 'Você ganhou a TAÇA DE PRATA! 🥈', 'Você ganhou a TAÇA DE BRONZE! 🥉'], tacas: (o, p, b) => `Suas taças: 🏆 ${o} · 🥈 ${p} · 🥉 ${b}`,
    campeao: 'CAMPEÃO!', vivas: ['Uhuu!', 'Bravo!', 'Isso aí!', 'É campeão!', 'Viva!'],
    difs: { facil: ['🐢', 'Fácil', 'rivais devagar'], medio: ['🚗', 'Médio', 'corrida de verdade'], dificil: ['🔥', 'Difícil', 'rivais jogam bolhas!'] },
    rapida: ['🏁', 'Corrida rápida', 'uma pista'], copas: { br: 'Copa Brasil', fi: 'Copa Finlândia', familia: 'Grande Copa da Família' },
    corridas: n => `${n} corridas`, corridaN: (a, b) => `Corrida ${a} de ${b}`, classificacao: 'Classificação da copa', proxima: (a, b) => `▶ Próxima corrida (${a}/${b})`,
    novaCopa: '🔁 Nova copa', campeaoCopa: n => `${n} é campeão da copa! 🏆`, copaTit: 'CAMPEÃO DA COPA!', dicaCopa: 'A copa passa por estas pistas, uma depois da outra. Cada corrida dá pontos: 1º 10, 2º 8, 3º 6, 4º 5, 5º 4, 6º 3, 7º 2.',
    copaGanha: ['Você ganhou a COPA DE OURO! 🏆', 'Você ganhou a COPA DE PRATA! 🥈', 'Você ganhou a COPA DE BRONZE! 🥉'], ptsAbrev: 'pts',
    acertado: n => `${n} te acertou!`,
    comoJogar: '1. Como vamos jogar?', quemEh: '2. Quem é o piloto?',

const SEG = 200, RUMBLE = 3, ESTRADA = 2000, FAIXAS = 3, CAM_ALT = 1550, VISTA = 320; // câmera alta: carro menor e mais paisagem
const CAM_PROF = 1 / Math.tan((100 / 2) * Math.PI / 180);
const JOGADOR_Z = CAM_ALT * CAM_PROF;

// ---------------- desenhos (sprites feitos no canvas) ----------------
function tela(w, h, desenhar) { const c = document.createElement('canvas'); c.width = w; c.height = h; desenhar(c.getContext('2d'), w, h); return c; }
function rr(g, x, y, w, h, r) { g.beginPath(); g.roundRect ? g.roundRect(x, y, w, h, r) : g.rect(x, y, w, h); g.fill(); }
function poli(g, pts, cor) { g.fillStyle = cor; g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); g.closePath(); g.fill(); }
function sombra(g, w, h) { g.fillStyle = 'rgba(0,0,0,.28)'; g.beginPath(); g.ellipse(w / 2, h - 8, w * .42, 9, 0, 0, Math.PI * 2); g.fill(); }

// carro visto de trás
function desenharCarro(cor, tipo, luz = 0, placa = 'JOSÉ') {
  return tela(240, 160, (g, w, h) => {
    sombra(g, w, h);
    g.fillStyle = '#16161a'; rr(g, 16, 104, 46, 48, 9); rr(g, 178, 104, 46, 48, 9);
    const corBaixo = tipo === 'policia' ? '#14161c' : cor;
    const cab = tipo === 'policia' ? '#f4f6fa' : cor;
    if (tipo === 'fusca' || tipo === 'ilo') {
      g.fillStyle = cab; g.beginPath(); g.ellipse(120, 78, 96, 66, 0, Math.PI, 0); g.fill();
      g.fillStyle = 'rgba(160,215,255,.9)'; g.beginPath(); g.ellipse(120, 62, 52, 34, 0, Math.PI, 0); g.fill();
    } else {
      poli(g, [52, 72, 188, 72, 168, 22, 72, 22], cab);
      poli(g, [66, 66, 174, 66, 158, 30, 82, 30], 'rgba(150,210,255,.95)');
      g.fillStyle = 'rgba(255,255,255,.35)'; poli(g, [90, 34, 110, 34, 96, 62, 76, 62], 'rgba(255,255,255,.35)');
    }
    g.fillStyle = corBaixo; rr(g, 8, 66, 224, 66, 20);
    if (tipo === 'policia') { g.fillStyle = '#f4f6fa'; rr(g, 8, 66, 224, 26, 14); }
    g.fillStyle = 'rgba(255,255,255,.18)'; rr(g, 14, 70, 212, 8, 4);
    // lanternas
    g.fillStyle = '#ff2a2a'; rr(g, 18, 80, 44, 18, 6); rr(g, 178, 80, 44, 18, 6);
    g.fillStyle = '#ffd0d0'; rr(g, 24, 84, 14, 8, 3); rr(g, 202, 84, 14, 8, 3);
    g.fillStyle = 'rgba(0,0,0,.35)'; rr(g, 16, 116, 208, 12, 6);
    // placa
    g.fillStyle = '#fff'; rr(g, 90, 96, 60, 20, 4);
    g.fillStyle = '#1b2a6b'; g.font = 'bold 13px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(tipo === 'policia' ? (salvo.lingua === 'fi' ? '112' : '190') : tipo === 'bombeiro' ? (salvo.lingua === 'fi' ? '112' : '193') : placa, 120, 107);
    if (tipo === 'ilo') { // orelhas de cachorro e patinhas
      g.fillStyle = '#6b3f1d';
      g.beginPath(); g.ellipse(58, 34, 16, 30, -.6, 0, 7); g.fill(); g.beginPath(); g.ellipse(182, 34, 16, 30, .6, 0, 7); g.fill();
      g.fillStyle = '#fff'; for (const [px, py] of [[40, 104], [200, 104]]) { g.beginPath(); g.arc(px, py, 6, 0, 7); g.fill(); for (const [dx, dy] of [[-7, -8], [0, -11], [7, -8]]) { g.beginPath(); g.arc(px + dx, py + dy, 3, 0, 7); g.fill(); } }
    }
    if (tipo === 'corrida') {
      g.fillStyle = '#fff'; g.fillRect(108, 22, 24, 48); g.fillRect(108, 66, 24, 30);
      g.fillStyle = '#111'; g.fillRect(64, 8, 8, 18); g.fillRect(168, 8, 8, 18); rr(g, 40, 2, 160, 12, 5);
    }
    if (tipo === 'taxi') {
      g.fillStyle = '#111'; for (let i = 0; i < 11; i++) g.fillRect(14 + i * 20, i % 2 ? 72 : 66, 10, 6);
      g.fillStyle = '#fff'; rr(g, 94, 6, 52, 16, 4); g.fillStyle = '#111'; g.font = 'bold 12px sans-serif'; g.fillText(T().taxi, 120, 15);
    }
    if (tipo === 'bombeiro') {
      g.fillStyle = '#c9ced6'; g.fillRect(60, 10, 6, 20); g.fillRect(174, 10, 6, 20); g.fillRect(60, 8, 120, 5);
      for (let x = 70; x < 176; x += 14) g.fillRect(x, 8, 4, 16);
      g.fillStyle = luz ? '#fff' : '#ffb000'; rr(g, 104, 0, 32, 10, 4);
    }
    if (tipo === 'policia') {
      g.fillStyle = '#222'; rr(g, 78, 8, 84, 14, 5);
      g.fillStyle = luz ? '#ff2a2a' : '#7a1010'; rr(g, 80, 9, 38, 12, 4);
      g.fillStyle = luz ? '#1e4cff' : '#1a2a6a'; rr(g, 122, 9, 38, 12, 4);
      g.fillStyle = '#14161c'; g.font = 'bold 15px sans-serif'; g.fillText(T().policia, 120, 80);
    }
  });
}

let segs = [], comprimento = 0, P = PISTAS[0], LARGADA = 8;
function ultimoY() { return segs.length ? segs[segs.length - 1].p2.mundo.y : 0; }
function novoSeg(curva, y) {
  const n = segs.length;
  segs.push({ i: n, p1: { mundo: { y: ultimoY(), z: n * SEG }, cam: {}, tela: {} }, p2: { mundo: { y, z: (n + 1) * SEG }, cam: {}, tela: {} },
    curva, sprites: [], carros: [], claro: Math.floor(n / RUMBLE) % 2 === 0 });
}
function trecho(entra, fica, sai, curva, altura) {
  const y0 = ultimoY(), y1 = y0 + altura * SEG, total = entra + fica + sai;
  for (let n = 0; n < entra; n++) novoSeg(easeIn(0, curva, n / entra), easeInOut(y0, y1, n / total));
  for (let n = 0; n < fica; n++) novoSeg(curva, easeInOut(y0, y1, (entra + n) / total));
  for (let n = 0; n < sai; n++) novoSeg(easeInOut(curva, 0, n / sai), easeInOut(y0, y1, (entra + fica + n) / total));
}
function montarPista(p) {
  P = p; segs = [];

  trecho(40, 40, 40, 0, -ultimoY() / SEG); // volta para a altura do começo
  const N = segs.length;
  comprimento = N * SEG;
  for (let i = LARGADA; i < LARGADA + 3; i++) segs[i].xadrez = true;
  // cenário dos dois lados
  for (let i = 12; i < N - 4; i += 3) {

    const tipo = p.cenario[Math.floor(rnd(i * 5.3) * p.cenario.length)];
    segs[i].sprites.push({ tipo, x: lado * (1.35 + rnd(i * 7.7) * 2.2) });
  }
  for (let i = 30; i < N; i += 260) segs[i].sprites.push({ tipo: 'placa_' + p.id, x: -1.7 }, { tipo: 'placa_' + p.id, x: 1.7 });
  if (p.id === 'papainoel') for (let i = 160; i < N; i += 400) segs[i].sprites.push({ tipo: 'napapiiri', x: -1.6 });
  segs[LARGADA].sprites.push({ tipo: 'bandeira', x: -1.25 }, { tipo: 'bandeira', x: 1.15 });

  }
  for (let i = 150; i < N - 20; i += 330) segs[i].sprites.push({ tipo: 'raio', x: [-.5, .5][Math.floor(rnd(i) * 2)], pego: [-1, -1] });

function usar(j) { J = j; ({ pos, dist, x, vel, turbo, moedas, volta, tremor, ceuOff, morroOff, avisos, teclas, sireneLigada, cuidadoT, terminouT } = j); SPR_JOGADOR = j.spr; carroEscolhido = j.carro; }
function guardarJ(j) { Object.assign(j, { pos, dist, x, vel, turbo, moedas, volta, tremor, ceuOff, morroOff, avisos, teclas, sireneLigada, cuidadoT, terminouT }); }

function aviso(txt, cor = '#ffd23f', grande = false, pt = '') { avisos.push({ txt, pt, cor, t: 0, grande }); if (avisos.length > 3) avisos.shift(); }

const numFi = n => n <= 10 ? NUM_FI[n] : n === 20 ? 'kaksikymmentä' : n === 30 ? 'kolmekymmentä' : n === 40 ? 'neljäkymmentä' : n === 50 ? 'viisikymmentä' : String(n);

function voz(fi, pt, { cor = '#ffd23f', grande = true, importante = false, mostrar = true } = {}) {
  if (mostrar) aviso(fi, cor, grande, pt);
  if (!salvo.som || !('speechSynthesis' in window)) return;
  const locais = jogadores.filter(j => !j.remoto).length;
  if (locais > 1 && !importante) return;                         // dois no mesmo celular: só as falas importantes
  if (fi === vozUltima && tempo < vozFim + 1) return;             // não repete a mesma fala para os dois
  if (!importante && (speechSynthesis.speaking || tempo < vozFim)) return; // não atropela outra fala
  try {
    if (importante) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(fi.replace(/[^\p{L}\p{N} ,.!?]/gu, ''));
    u.lang = 'fi-FI'; u.rate = 1; u.pitch = 1.25;
    const v = speechSynthesis.getVoices().find(v => /^fi/i.test(v.lang)); if (v) u.voice = v;
    speechSynthesis.speak(u); vozFim = tempo + 1.2; vozUltima = fi;

}

function novoPiloto(id, quem, carroId, remoto = false) {
  const carro = CARROS.find(c => c.id === carroId) || CARROS[0];
  const tipo = carro.tipo || carro.id, h = pessoa(quem);
  const placa = placaDe(h);
  const spr = [desenharCarro(carro.cor, tipo, 0, placa), desenharCarro(carro.cor, tipo, 1, placa)];
  const j = { ...h, id, quem, cor: carro.cor, carro, spr, remoto,
    pos: 0, dist: 0, x: 0, vel: 0, turbo: 0, moedas: 0, volta: 0, tremor: 0, ceuOff: 0, morroOff: 0, avisos: [],
    teclas: { esq: false, dir: false, freio: false }, sireneLigada: false, cuidadoT: -9, terminouT: 0, fim: 0, lugar: 0, atras: new Map(), alvoX: 0, alvoD: 0, rodar: 0, tiroT: 0 };
  // o carro dele como os outros o veem na pista
  j.obj = { humano: id, nome: h.nome, nomeFi: h.nomeFi, pt: h.pt, fi: h.fi, cor: carro.cor, spr: spr[0], sprLuz: spr[1], x: 0, z: 0, dist: 0, vel: 0 };
  return j;
}

// config: { pista, pilotos: [{ quem, carro, remoto }] }
function novaCorrida(cfg) {
  DIF = DIFS[cfg.dif] || DIFS.medio;
  if (cfg.copa !== undefined) copa = cfg.copa; // online: quem entrou recebe a copa de quem criou a sala
  criarSprites();
  montarPista(PISTAS.find(p => p.id === cfg.pista) || PISTAS[0]);
  const zLarg = LARGADA * SEG;
  jogadores = cfg.pilotos.map((p, k) => novoPiloto(k, p.quem, p.carro, p.remoto));
  const humanos = jogadores.map(j => j.quem);
  // rivais da família (quem está jogando de verdade não corre como rival)
  const grid = [[0, -.5], [-1, .5], [-2, -.5], [-4, -.5], [-5, .5]];
  const ordemRivais = ['gabi', 'ana', 'ilo', 'keka', 'emiel', 'vovo', 'jose'];
  rivais = ordemRivais.filter(id => !humanos.includes(id)).slice(0, 5).map(pessoa).map((r, k) => {
    const d = (grid[k][0] + 1) * 3.2 * SEG;
    const c = { ...r, fator: Math.min(.99, r.vel * DIF.fator), tiroT: 6 + k * 2.5, x: grid[k][1], dist: d, vel: 0, spr: desenharCarro(r.cor, r.tipo, 0, placaDe(r)), fim: 0, alvoD: d, alvoX: grid[k][1] };
    c.z = mod(zLarg + d, comprimento);
    return c;
  });
  for (const s of segs) s.carros = [];
  for (const c of rivais) segDe(c.z).carros.push(c);
  jogadores.forEach((j, k) => {
    j.dist = j.alvoD = -2.2 * SEG - k * 1.6 * SEG; j.x = j.alvoX = k ? -.5 : .5;
    j.pos = mod(zLarg + j.dist - JOGADOR_Z, comprimento);
    for (const c of rivais) j.atras.set(c, c.dist < j.dist);
    j.obj.dist = j.dist; j.obj.x = j.x; j.obj.z = mod(zLarg + j.dist, comprimento);
    segDe(j.obj.z).carros.push(j.obj);
  });
  for (const j of jogadores) for (const o of jogadores) if (o !== j) j.atras.set(o.obj, o.dist < j.dist);
  chegada = []; tiros = []; modo = 'largada'; largadaT = 0; tempo = 0; fimT = 0; fimMostrado = false; pausado = false;

}

function colocacaoDe(j) {
  return 1 + rivais.filter(c => c.dist > j.dist).length + jogadores.filter(o => o !== j && o.dist > j.dist).length;
}
function colocacao() { return J.fim ? J.lugar : colocacaoDe(J); }
function moverNoSeg(c, zNovo) {
  const a = segDe(c.z), b = segDe(zNovo);
  c.z = zNovo;
  if (a !== b) { const k = a.carros.indexOf(c); if (k >= 0) a.carros.splice(k, 1); b.carros.push(c); }
}

function passo(dt) {
  tempo += dt;
  if (modo === 'largada') {
    const antes = largadaT; largadaT += dt;
    for (const s of [0, 1, 2]) if (antes < s + .5 && largadaT >= s + .5) { som.bip(440); voz(['Kolme', 'Kaksi', 'Yksi'][s], ['Três', 'Dois', 'Um'][s], { importante: true, mostrar: false }); }
    if (antes < 3.5 && largadaT >= 3.5) {
      som.bip(880, .5); modo = 'corrida'; som.musica(true);
      const locais = jogadores.filter(j => !j.remoto);
      const fi = locais.length > 1 ? '' : ', ' + locais[0].nomeFi, pt = locais.length > 1 ? '' : ', ' + locais[0].nome;
      for (const j of locais) { usar(j); aviso(`Aja${fi}!`, '#7dff9a', true, `Vai${pt}!`); guardarJ(j); }
      voz(`Aja${fi}!`, `Vai${pt}!`, { importante: true, mostrar: false });
    }
    return;
  }
  if (modo !== 'corrida') return;
  for (const j of jogadores) {
    if (j.remoto) { remotoAndar(j, dt); continue; }
    usar(j); andarJogador(dt); guardarJ(j);
    j.obj.dist = j.dist; j.obj.x = j.x; j.obj.vel = j.vel; moverNoSeg(j.obj, mod(LARGADA * SEG + j.dist, comprimento));
  }
  if (rede.papel === 'conv') rivaisRemotos(dt); else andarRivais(dt);
  andarBolhas(dt);
  // fim da corrida: todos os pilotos chegaram (ou 25 s depois do primeiro)
  const primeiro = jogadores.find(j => j.fim);
  if (primeiro && (jogadores.every(j => j.fim) || tempo - primeiro.fim > 25)) { fimT += dt; if (fimT > 2.4) mostrarFim(); }
  usar(jogadores.find(j => !j.remoto));
}

function andarJogador(dt) {
  const segJ = segDe(pos + JOGADOR_Z), pct = vel / VMAX, dx = dt * 2.2 * Math.max(pct, .25);
  const correndo = !J.fim;
  const rodando = J.rodar > 0;
  if (rodando) J.rodar = Math.max(0, J.rodar - dt);
  if (correndo && !rodando) {
    if (teclas.esq) x -= dx; else if (teclas.dir) x += dx;
    else { const alvo = lim(x, -.7, .7); x += (alvo - x) * Math.min(1, dt * DIF.ajuda); } // ajudinha: volta para a estrada
  } else x = interp(x, J.id ? -.4 : .4, dt); // depois da chegada vai sozinho
  x -= dx * pct * segJ.curva * CENTRIFUGA;
  const vmax = VMAX * (turbo > 0 ? 1.35 : 1);
  if (!correndo) vel = Math.max(VMAX * .3, vel + SOLTO * dt);
  else if (teclas.freio) vel += FREIO * dt;
  else vel += ACEL * (turbo > 0 ? 1.8 : 1) * dt;
  if (Math.abs(x) > 1 && vel > FORA_LIM) { vel += FORA * dt; tremor = .5; }
  vel = lim(vel, 0, rodando ? VMAX * .35 : vmax);
  x = lim(x, -2.6, 2.6);
  turbo = Math.max(0, turbo - dt);
  // batida em árvore/placa fora da estrada: só freia e empurra de volta
  if (Math.abs(x) > 1) for (const s of segJ.sprites) {
    if (s.pego !== undefined || !S[s.tipo]) continue;
    const w = S[s.tipo].w / ESTRADA * .6;
    if (sobrepoe(x, LARG_CARRO / ESTRADA, s.x + (s.x < 0 ? -w / 2 : w / 2), w)) {
      vel = VMAX / 5; x += x > 0 ? -.35 : .35; tremor = .4; som.batida(); cuidado(); break;
    }
  }
  // moedas e raios (cada piloto pega as suas)
  for (const k of [-1, 0, 1]) for (const s of segs[mod(segJ.i + k, segs.length)].sprites) {
    if (s.pego === undefined || s.pego[J.id] === volta) continue;
    if (sobrepoe(x, LARG_CARRO / ESTRADA, s.x, S[s.tipo].w / ESTRADA * 1.4)) {
      s.pego[J.id] = volta;
      if (s.tipo === 'moeda') { moedas++; som.moeda(); if (moedas % 10 === 0) voz(`Hienoa! ${numFi(moedas)} kolikkoa!`, `Muito bem! ${numPt(moedas)} moedas!`); else aviso('+1 🪙'); }
      else { turbo = 3; som.turbo(); voz('Turbo!', 'Turbo!', { cor: '#7fe3ff', importante: true }); }
    }
  }
  // batidas com os rivais e com o outro piloto: freia e é empurrado para o lado
  if (correndo) for (const c of [...rivais, ...jogadores.filter(o => o !== J).map(o => o.obj)]) {
    if (vel <= c.vel) continue;
    const d = c.dist - (dist + JOGADOR_Z);
    if (d > 0 && d < SEG * 1.2 && sobrepoe(x, LARG_CARRO / ESTRADA, c.x, LARG_CARRO / ESTRADA, .85)) {
      vel = c.vel * .85; x += x < c.x ? -.18 : .18; tremor = .3; som.batida(); cuidado();
    }
  }
  // anda
  dist += vel * dt;
  pos = mod(LARGADA * SEG + dist - JOGADOR_Z, comprimento);
  const novaVolta = Math.max(0, Math.floor(dist / comprimento));
  if (novaVolta > volta && correndo) { volta = novaVolta; if (volta < VOLTAS) { som.bip(660, .3); voz('Viimeinen kierros!', 'Última volta!', { cor: '#fff', importante: true }); } }
  if (correndo) for (const c of [...rivais, ...jogadores.filter(o => o !== J).map(o => o.obj)]) {
    // só conta a ultrapassagem quando abre um pouco de distância (lado a lado não fica repetindo)
    const antes = J.atras.get(c);
    if (antes === false && c.dist < dist - SEG * 1.5) { J.atras.set(c, true); voz(`Ohitit ${c.fi}!`, `Você passou ${c.pt}!`, { cor: '#7dff9a' }); }
    else if (antes === true && c.dist > dist + SEG * 1.5) J.atras.set(c, false);
  }

  if (J.fim) terminouT += dt;
}

function andarRivais(dt) {
  const lider = Math.max(...jogadores.map(j => j.dist));
  for (const c of rivais) {
    const gap = c.dist - lider;
    let alvo = VMAX * c.fator;
    if (gap > DIF.espera) alvo *= .86;                     // muito na frente: espera um pouco
    else if (gap < -5000) alvo = VMAX * DIF.alcanca;       // muito atrás: corre para alcançar

    c.vel += (alvo - c.vel) * Math.min(1, dt * .9);

    for (const j of jogadores) if (Math.abs(c.dist - (j.dist + JOGADOR_Z)) < 9 * SEG && c.dist < j.dist + JOGADOR_Z && sobrepoe(c.x, .6, j.x, .6)) c.x += (c.x > j.x ? 1 : -1) * dt * .9;
    for (const o of rivais) if (o !== c && o.dist > c.dist && o.dist - c.dist < 6 * SEG && sobrepoe(c.x, .5, o.x, .5)) c.x += (c.x >= o.x ? 1 : -1) * dt * .7;
    c.x = lim(c.x + Math.sin(tempo * .4 + c.fator * 9) * dt * .05, -.8, .8);
    c.dist += c.vel * dt;
    moverNoSeg(c, mod(LARGADA * SEG + c.dist, comprimento));
    if (!c.fim && c.dist >= VOLTAS * comprimento) { c.fim = tempo; chegada.push(c); }
  }
  // no difícil, os rivais que estão logo atrás de um piloto jogam bolhas nele
  if (DIF.bolhas && modo === 'corrida') rivais.forEach((c, k) => {
    if (c.fim || c.rodar > 0 || tempo < c.tiroT) return;
    for (const j of jogadores) {
      const d = j.dist + JOGADOR_Z - c.dist;
      if (!j.fim && d > SEG * 2 && d < SEG * 9 && Math.abs(j.x - c.x) < .45) {
        c.tiroT = tempo + 7 + rnd(tempo + k) * 6;
        novaBolha(-1 - k, c.dist + SEG * .6, c.x, c.vel);
        rede.enviar({ t: 'tiro', r: k, d: Math.round(c.dist + SEG * .6), x: +c.x.toFixed(3), v: Math.round(c.vel) });

}
// quem entrou na sala recebe os rivais de quem criou: só anda entre uma mensagem e outra
function rivaisRemotos(dt) {
  for (const c of rivais) {
    if (c.rodar > 0) c.rodar = Math.max(0, c.rodar - dt);
    c.alvoD += c.vel * dt;
    c.dist = interp(c.dist + c.vel * dt, c.alvoD, Math.min(1, dt * 4));
    c.x = interp(c.x, c.alvoX, Math.min(1, dt * 6));

    if (!c.fim && c.dist >= VOLTAS * comprimento) { c.fim = tempo; chegada.push(c); }
  }
}
function remotoAndar(j, dt) {
  j.alvoD += j.vel * dt;
  j.dist = interp(j.dist + j.vel * dt, j.alvoD, Math.min(1, dt * 4));
  j.x = interp(j.x, j.alvoX, Math.min(1, dt * 8));

// ---------------- bolhas mágicas: quem é acertado rodopia e fica lento ----------------
function atirar(j) {
  if (!j || j.remoto || modo !== 'corrida' || j.fim || j.rodar > 0 || tempo < j.tiroT) return;
  j.tiroT = tempo + .9;
  novaBolha(j.id, j.dist + JOGADOR_Z + SEG * .6, j.x, j.vel);
  som.bolha();

}
function novaBolha(dono, d, bx, v) {
  const b = { tiro: true, dono, dist: d, x: bx, vel: v + VMAX * .85, vida: 2.4, z: mod(LARGADA * SEG + d, comprimento) };

function tirarDaPista(b) { const sg = segDe(b.z), k = sg.carros.indexOf(b); if (k >= 0) sg.carros.splice(k, 1); }
function andarBolhas(dt) {
  for (const b of tiros) {

    const rival = b.dono < 0 ? rivais[-1 - b.dono] : null; // bolha jogada por um rival só acerta os pilotos
    const alvos = rival ? jogadores.map(j => j.obj) : [...rivais, ...jogadores.filter(j => j.id !== b.dono).map(j => j.obj)];
    for (const c of alvos) {
      if (c.fim || c.rodar > 0 || Math.abs(c.dist - b.dist) > SEG * .9 || Math.abs(c.x - b.x) > .38) continue;
      b.vida = 0; som.pop();
      const atirador = jogadores[b.dono];

        const j = jogadores[c.humano];
        if (!j.remoto) { j.rodar = 1.4; j.vel *= .4; usar(j); voz('Voi ei!', rival ? T().acertado(nomeL(rival)) : 'Ah, não!', { cor: '#ff8a8a', importante: true }); tremor = .4; guardarJ(j); }
        else c.rodar = 1.4;
      } else c.rodar = 1.4;
      if (atirador && !atirador.remoto) { usar(atirador); voz('Osuma! 🫧', `Acertou ${c.pt}!`, { cor: '#9fe7ff' }); guardarJ(atirador); }
      break;
    }
  }
  for (const b of tiros) if (b.vida <= 0) tirarDaPista(b);
  tiros = tiros.filter(b => b.vida > 0);
}

function cuidado() { if (tempo - cuidadoT > 6) { cuidadoT = tempo; voz('Varo!', 'Cuidado!', { cor: '#ff8a8a' }); } }

function terminar() {

// ---------------- desenho ----------------
function projetar(p, cx, cy, cz) {

  p.tela.y = Math.round(H / 2 - p.tela.esc * p.cam.y * H / 2);

function desenharSeg(s, neb) {
  const a = s.p1.tela, b = s.p2.tela, c = P.cores, k = s.claro ? 0 : 1;

  quad(a.x + a.w + r1, a.y, r1, b.x + b.w + r2, b.y, r2, c.rumble[k]);
  quad(a.x, a.y, a.w, b.x, b.y, b.w, c.estrada[k]);

    const n = 10;
    for (let i = 0; i < n; i++) {
      const u0 = -1 + 2 * i / n, u1 = -1 + 2 * (i + 1) / n;
      poli(ctx, [a.x + a.w * u0, a.y, a.x + a.w * u1, a.y, b.x + b.w * u1, b.y, b.x + b.w * u0, b.y], (i + s.i) % 2 ? '#111' : '#fff');
    }
  } else if (s.claro) {
    const l1 = a.w / Math.max(32, 8 * FAIXAS), l2 = b.w / Math.max(32, 8 * FAIXAS);
    for (let f = 1; f < FAIXAS; f++) {

// placar desenhado na tela de cada um (modo de dois no mesmo celular)

    festa.podio = tabela.slice(0, 3).map(([k]) => {
      const h = jogadores.find(j => j.quem === k), r = rivais.find(c => c.id === k), f = pessoa(k);
      return { nome: nomeL(f), cor: f.cor, ic: f.ic, spr: h ? h.spr[0] : r ? r.spr : desenharCarro(f.cor, f.tipo, 0, placaDe(f)) };
    });
  }
  document.getElementById('podio').innerHTML = ordem.map((c, i) =>
    `<div class="linha${c.eu ? ' eu' : ''}"><b>${t.ord(i + 1)}</b><span class="bola" style="background:${c.cor}"></span><span>${nomeL(c)}</span><span>${i < 3 ? ['🥇', '🥈', '🥉'][i] : ''}</span></div>`).join('');
  let melhor = 99;
  if (jogadores.length === 1) {
    const lugar = lugarDe(J); melhor = lugar;
    document.getElementById('lugar').textContent = `${['🏆', '🥈', '🥉'][lugar - 1] || '🏁'} ${t.lugar(lugar)}`;
    frase.textContent = `${t.frases[lugar] || t.fraseOutra} ${t.moedas(moedas)}`;
    const ordFi = ['ensimmäinen', 'toinen', 'kolmas', 'neljäs', 'viides', 'kuudes'][lugar - 1];
    const fi = lugar === 1 ? `Onneksi olkoon, ${J.nomeFi}! Olet mestari!` : `Onneksi olkoon, ${J.nomeFi}! Olit ${ordFi}!`;
    voz(fi, '', { importante: true, mostrar: false });
    frase.insertAdjacentHTML('beforeend', `<br><small>🗣️ “${fi}”</small>`);
  } else {
    const lista = jogadores.map(j => ({ j, l: lugarDe(j) })).sort((a, b) => a.l - b.l);
    const v = lista[0].j;
    for (const { j, l } of lista) if (!j.remoto) melhor = Math.min(melhor, l);
    document.getElementById('lugar').textContent = `🏆 ${t.venceu(nomeL(v))}`;
    frase.textContent = lista.map(({ j, l }) => `${nomeL(j)}: ${t.ord(l)} (🪙 ${j.moedas})`).join('  ·  ');
    const fi = `Onneksi olkoon, ${v.nomeFi}! Voitit!`;
    voz(fi, '', { importante: true, mostrar: false });
    frase.insertAdjacentHTML('beforeend', `<br><small>🗣️ “${fi}”</small>`);
  }
  const tr = salvo.trofeus[P.id];
  if (melhor < 99 && (!tr || melhor < tr)) salvo.trofeus[P.id] = melhor;
  // taça para quem subiu no pódio
  salvo.tacas = salvo.tacas || { ouro: 0, prata: 0, bronze: 0 };
  if (melhor <= 3) salvo.tacas[['ouro', 'prata', 'bronze'][melhor - 1]]++;
  document.getElementById('taca').textContent = melhor <= 3 ? t.taca[melhor - 1] : '';
  if (ultimaDaCopa) {
    const humanosIds = jogadores.filter(j => !j.remoto).map(j => j.quem);
    const lugarCopa = Math.min(...humanosIds.map(k => tabela.findIndex(([q]) => q === k) + 1));
    document.getElementById('lugar').textContent = `🏆 ${t.campeaoCopa(nomeL(pessoa(tabela[0][0])))}`;
    document.getElementById('taca').textContent = lugarCopa <= 3 ? t.copaGanha[lugarCopa - 1] : '';
    const ant = salvo.copas[copa.id];
    if (lugarCopa <= 3 && (!ant || lugarCopa < ant.lugar || (lugarCopa === ant.lugar && ['facil', 'medio', 'dificil'].indexOf(salvo.dif) > ['facil', 'medio', 'dificil'].indexOf(ant.dif)))) salvo.copas[copa.id] = { lugar: lugarCopa, dif: salvo.dif };
    voz(`Onneksi olkoon, ${pessoa(tabela[0][0]).nomeFi}! Olet mestari!`, '', { importante: true, mostrar: false });
  }
  guardar();
  som.fanfarra();
  // online: só quem criou a sala escolhe a próxima corrida
  const conv = rede.papel === 'conv';
  document.getElementById('denovo').hidden = conv;
  document.getElementById('denovo').textContent = copa ? (ultimaDaCopa ? t.novaCopa : t.proxima(copa.i + 2, copa.pistas.length)) : t.denovo;
  document.getElementById('outra').textContent = conv ? t.sairSala : t.outra;
  if (conv) frase.insertAdjacentHTML('beforeend', `<br><small>${t.aguardando(nomeOutro())}</small>`);
  mostrar('fim');
}

function montarMenu() {
  const elC = document.getElementById('carros'), elP = document.getElementById('pistas');
  elC.innerHTML = ''; elP.innerHTML = '';
  const elM = document.getElementById('modos'); elM.innerHTML = '';
  for (const m of ['solo', 'dupla', 'online']) {
    const b = document.createElement('button');
    b.className = 'escolha'; b.setAttribute('aria-pressed', String(salvo.modo === m));
    const [nome, sub] = T().modos[m];
    b.innerHTML = `<span class="ic">${nome.split(' ')[0]}</span><b>${nome.split(' ').slice(1).join(' ')}</b><small>${sub}</small>`;
    b.onclick = () => { salvo.modo = m; guardar(); montarMenu(); };
    elM.append(b);
  }
  if (salvo.eu === salvo.eu2) salvo.eu2 = salvo.eu === 'gabi' ? 'jose' : 'gabi';
  const p1 = pessoa(salvo.eu), p2 = pessoa(salvo.eu2);
  document.getElementById('dicaModo').textContent = salvo.modo === 'dupla' ? T().dicaDupla(nomeL(p1), nomeL(p2)) : salvo.modo === 'online' ? T().dicaOnline : '';
  const dupla = salvo.modo === 'dupla';
  document.getElementById('quemTit').textContent = dupla ? T().piloto1 : T().quemEh;
  document.getElementById('quem2Tit').textContent = dupla ? T().piloto2 : '';
  const listaGente = (el, chave, outro) => {
    el.innerHTML = '';
    for (const f of FAMILIA) {
      const b = document.createElement('button');
      b.className = 'escolha'; b.setAttribute('aria-pressed', String(salvo[chave] === f.id));
      b.innerHTML = `<span class="ic">${f.ic}</span><b>${nomeL(f)}</b>`;
      b.onclick = () => { if (outro && salvo[outro] === f.id) salvo[outro] = salvo[chave]; salvo[chave] = f.id; guardar(); som.iniciar(); som.buzina(); montarMenu(); };
      el.append(b);
    }
  };
  listaGente(document.getElementById('quem'), 'eu', dupla ? 'eu2' : null);
  if (dupla) listaGente(document.getElementById('quem2'), 'eu2', 'eu'); else document.getElementById('quem2').innerHTML = '';
  const btC = document.getElementById('correr'), btE = document.getElementById('entrar');
  const hostPronto = rede.papel === 'host' && rede.outro;
  btC.textContent = salvo.modo === 'online' && !hostPronto ? T().criarSala : T().correr;
  btE.textContent = T().entrar; btE.hidden = salvo.modo !== 'online' || !!rede.papel;
  for (const c of CARROS) {
    if (c.oculto) continue;
    const b = document.createElement('button');
    b.className = 'escolha'; b.setAttribute('aria-pressed', String(salvo.carro === c.id));
    const img = new Image(); img.alt = ''; img.src = desenharCarro(c.cor, c.tipo || c.id, 1).toDataURL();
    b.append(img); b.insertAdjacentHTML('beforeend', `<b>${nomeL(c)}</b>${c.sirene ? `<small>${T().sirene}</small>` : ''}`);
    b.onclick = () => { salvo.carro = c.id; guardar(); som.iniciar(); som.buzina(); montarMenu(); };
    elC.append(b);
  }
  const elD = document.getElementById('difs'); elD.innerHTML = '';
  for (const d of ['facil', 'medio', 'dificil']) {
    const [ic, nome, sub] = T().difs[d], b = document.createElement('button');
    b.className = 'escolha'; b.setAttribute('aria-pressed', String(salvo.dif === d));
    b.innerHTML = `<span class="ic">${ic}</span><b>${nome}</b><small>${sub}</small>`;
    b.onclick = () => { salvo.dif = d; guardar(); montarMenu(); };
    elD.append(b);
  }
  const elT = document.getElementById('tipos'); elT.innerHTML = '';
  for (const c of [null, ...COPAS]) {
    const id = c ? c.id : 'rapida', b = document.createElement('button');
    b.className = 'escolha'; b.setAttribute('aria-pressed', String(salvo.tipo === id));
    if (!c) b.innerHTML = `<span class="ic">${T().rapida[0]}</span><b>${T().rapida[1]}</b><small>${T().rapida[2]}</small>`;
    else {
      const g = salvo.copas[c.id], difNome = g ? T().difs[g.dif][1] : '';
      b.innerHTML = `<span class="ic">${c.ic}</span><b>${T().copas[c.id]}</b><small>${c.pistas.map(pp => PISTAS.find(x => x.id === pp).ic).join(' ')} · ${T().corridas(c.pistas.length)}</small><small>${g ? `${['🏆', '🥈', '🥉'][g.lugar - 1]} ${difNome}` : T().semTrofeu}</small>`;
    }
    b.onclick = () => { salvo.tipo = id; guardar(); montarMenu(); };
    elT.append(b);
  }
  const ehCopa = salvo.tipo !== 'rapida';
  document.getElementById('tituloPista').hidden = ehCopa; document.getElementById('pistas').hidden = ehCopa;
  document.getElementById('dicaCopa').textContent = ehCopa ? T().dicaCopa : '';
  for (const p of PISTAS) {
    const b = document.createElement('button');
    b.className = 'escolha pista'; b.setAttribute('aria-pressed', String(salvo.pista === p.id));
    b.style.setProperty('--fundo-pista', p.fundoMenu);
    const t = salvo.trofeus[p.id];
    b.innerHTML = `<span class="ic">${p.ic}</span><b>${nomeL(p)}</b><small>${t ? (T().trofeu[t - 1] || T().melhor(t)) : T().semTrofeu}</small>`;
    b.onclick = () => { salvo.pista = p.id; guardar(); montarMenu(); };
    elP.append(b);
  }
  document.getElementById('som').textContent = salvo.som ? T().som : T().semSom;
  const tc = salvo.tacas || {};
  document.getElementById('tacas').textContent = (tc.ouro || tc.prata || tc.bronze) ? T().tacas(tc.ouro || 0, tc.prata || 0, tc.bronze || 0) : '';
  document.documentElement.lang = salvo.lingua === 'fi' ? 'fi' : 'pt-BR';
  document.title = T().titulo;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T()[el.dataset.t];
  for (const b of document.querySelectorAll('.lingua')) {
    b.setAttribute('aria-pressed', String(b.dataset.l === salvo.lingua));
    b.onclick = () => { salvo.lingua = b.dataset.l; guardar(); criarSprites(); montarMenu(); };
  }
}

function irMenu() {
  copa = null;
  modo = 'menu'; pausado = false; som.motor(false); som.sirene(false); som.musica(false);
  if (rede.papel === 'conv') rede.fechar();   // quem entrou na sala sai dela ao voltar para o menu
  for (const s of segs) s.carros = [];
  jogadores = []; usar(menuJ); montarMenu(); mostrar('menu');
}
let ultimaCfg = null;
function correr() {
  som.iniciar();
  if (salvo.modo === 'online') {
    if (rede.papel === 'host' && rede.outro) { novaCopa(); rede.iniciar(); }
    else if (rede.papel === 'host') painelSala('codigo');
    else rede.criar();
    return;
  }
  novaCopa();
  ultimaCfg = salvo.modo === 'dupla'
    ? { pista: pistaAgora(), dif: salvo.dif, pilotos: [{ quem: salvo.eu, carro: salvo.carro }, { quem: salvo.eu2, carro: 'p_' + salvo.eu2 }] }
    : { pista: pistaAgora(), dif: salvo.dif, pilotos: [{ quem: salvo.eu, carro: salvo.carro }] };
  novaCorrida(ultimaCfg);
}
function novaCopa() {
  const c = COPAS.find(c => c.id === salvo.tipo);
  copa = c ? { id: c.id, pistas: c.pistas, i: 0, pontos: {}, ganhou: {} } : null;
}
const pistaAgora = () => copa ? copa.pistas[copa.i] : salvo.pista;
// botão do fim: próxima corrida da copa, nova copa ou correr de novo
function seguir() {
  if (copa) { if (copa.i >= copa.pistas.length - 1) novaCopa(); else copa.i++; }
  if (rede.papel === 'host' && rede.outro) return rede.iniciar();
  if (!ultimaCfg) return correr();
  novaCorrida({ ...ultimaCfg, pista: pistaAgora(), dif: salvo.dif });
}
document.getElementById('correr').onclick = correr;
document.getElementById('entrar').onclick = () => { som.iniciar(); painelSala('digitar'); };
document.getElementById('denovo').onclick = seguir;
document.getElementById('outra').onclick = () => { if (rede.papel === 'conv') rede.fechar(); irMenu(); };
document.getElementById('som').onclick = () => { som.ligar(!salvo.som); montarMenu(); };
document.getElementById('pausa').onclick = () => { pausado = true; mostrar('pausa'); som.musica(false); };
document.getElementById('continuar').onclick = () => { pausado = false; mostrar('jogo'); if (modo === 'corrida') som.musica(true); };
document.getElementById('sair').onclick = () => { pausado = false; irMenu(); };

// ---------------- controles ----------------
function botao(id, ao, solta) {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); som.iniciar(); b.classList.add('ativa'); ao(); try { b.setPointerCapture(e.pointerId); } catch {} };
  const off = () => { b.classList.remove('ativa'); if (solta) solta(); };
  b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off);
}
const local = i => jogadores.filter(j => !j.remoto)[i];
const tecla = (i, k, v) => { const j = local(i); if (j) j.teclas[k] = v; };
botao('esq', () => tecla(0, 'esq', true), () => tecla(0, 'esq', false));
botao('dir', () => tecla(0, 'dir', true), () => tecla(0, 'dir', false));
botao('p1esq', () => tecla(0, 'esq', true), () => tecla(0, 'esq', false));
botao('p1dir', () => tecla(0, 'dir', true), () => tecla(0, 'dir', false));
botao('p2esq', () => tecla(1, 'esq', true), () => tecla(1, 'esq', false));
botao('p2dir', () => tecla(1, 'dir', true), () => tecla(1, 'dir', false));
botao('buzina', () => som.buzina());
botao('tiro', () => atirar(local(0)));
botao('p1tiro', () => atirar(local(0)));
botao('p2tiro', () => atirar(local(1)));
botao('sirene', () => { const j = local(0); if (!j) return; j.sireneLigada = !j.sireneLigada; som.sirene(j.sireneLigada); });
// teclado: José usa A/D/S, a Gabi usa as setas (sozinho, as duas servem)
function teclaPara(e) {
  const dupla = jogadores.filter(j => !j.remoto).length > 1;
  const k = { a: 'esq', d: 'dir', s: 'freio', arrowleft: 'esq', arrowright: 'dir', arrowdown: 'freio' }[e.key.toLowerCase()];
  if (!k) return null;
  return [dupla && e.key.startsWith('Arrow') ? 1 : 0, k];
}
addEventListener('keydown', e => {
  const tk = teclaPara(e); if (tk) tecla(tk[0], tk[1], true);
  if (!e.repeat && modo !== 'menu') {
    const dupla = jogadores.filter(j => !j.remoto).length > 1;
    if (e.key === ' ' || e.key === 'w' || e.key === 'W') { e.preventDefault(); atirar(local(0)); }
    if (e.key === 'ArrowUp') { e.preventDefault(); atirar(local(dupla ? 1 : 0)); }
    if (e.key === 'b' || e.key === 'B') som.buzina();
  }
  if ((e.key === 'Escape' || e.key === 'p') && (modo === 'corrida' || modo === 'largada')) { pausado = !pausado; mostrar(pausado ? 'pausa' : 'jogo'); }
});
addEventListener('keyup', e => { const tk = teclaPara(e); if (tk) tecla(tk[0], tk[1], false); });
document.addEventListener('visibilitychange', () => { if (document.hidden && (modo === 'corrida' || modo === 'largada')) { pausado = true; mostrar('pausa'); } });

// ---------------- laço principal ----------------
criarSprites();
montarPista(PISTAS.find(p => p.id === salvo.pista) || PISTAS[0]);
const menuJ = novoPiloto(0, salvo.eu, 'corrida');
menuJ.pos = mod(LARGADA * SEG - JOGADOR_Z - SEG * 6, comprimento);
usar(menuJ); montarMenu(); mostrar('menu');
let ultimo = performance.now(), acum = 0;
function quadro(agora) {
  const dt = Math.min(.1, (agora - ultimo) / 1000); ultimo = agora;
  if (modo === 'menu') { tempo += dt; menuJ.pos = mod(menuJ.pos + VMAX * .25 * dt, comprimento); menuJ.ceuOff += .00005; }
  else if (!pausado && modo !== 'fim') { acum += dt; while (acum >= 1 / 60) { passo(1 / 60); acum -= 1 / 60; } }
  else if (modo === 'fim') { tempo += dt; }
  if (modo !== 'menu' && modo !== 'fim') {
    for (const j of jogadores) if (!j.remoto) j.obj.spr = j.sireneLigada && Math.floor(tempo * 6) % 2 ? j.spr[1] : j.spr[0];
    rede.estado();
    const l0 = local(0), l1 = local(1);
    for (const [id, j] of [['tiro', l0], ['p1tiro', l0], ['p2tiro', l1]]) document.getElementById(id).classList.toggle('recarga', !!j && (tempo < j.tiroT || j.rodar > 0));
  }
  som.atualizar();
  desenharTudo();
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);
window.__turbo = { get estado() { return { modo, dist, comprimento, volta, vel, x, lugar: J && modo !== 'menu' ? colocacao() : 0, pilotos: jogadores.map(j => [j.nome, Math.round(j.dist), j.fim ? 1 : 0]) }; }, pular(d) { for (const j of jogadores) if (!j.remoto) j.dist += d; } };
</script>
