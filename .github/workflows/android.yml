name: App Android

on:
  push:
    branches: [claude/game-executable-playable-83n63o, main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - name: Ícone e tela de abertura
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#ffc93c' --splashBackgroundColor '#0b1530' --splashBackgroundColorDark '#0b1530'
      - name: Jogo sempre deitado (paisagem)
        run: sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - name: Assinatura fixa (para atualizar sem desinstalar)
        run: mkdir -p ~/.android && cp android-signing/debug.keystore ~/.android/debug.keystore
      - name: Gerar APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk MadrinhaAna.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MadrinhaAna-apk
          path: MadrinhaAna.apk
      - name: Publicar para download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Madrinha Ana ao Resgate v1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            Baixe o arquivo **MadrinhaAna.apk** abaixo no celular Android e toque nele para instalar.
            Se o celular pedir, permita instalar apps desta fonte.
          files: MadrinhaAna.apk
