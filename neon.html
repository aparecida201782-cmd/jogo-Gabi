<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05030f">
<title>Esquadrão Neon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root{--ink:#eaf6ff;--neon:#38e8ff;--neon2:#b06bff;--pink:#ff4fa3;--gold:#ffd84a;--line:rgba(120,220,255,.35);--bg:#05030f}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;font-family:"Exo 2","Trebuchet MS",system-ui,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  .ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:radial-gradient(120% 90% at 50% 0%,rgba(56,232,255,.14),transparent 60%),radial-gradient(90% 80% at 100% 100%,rgba(176,107,255,.2),transparent 60%),rgba(3,4,16,.6);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);z-index:5}
  .ov[hidden]{display:none}
  .card{position:relative;background:linear-gradient(160deg,rgba(24,30,82,.94),rgba(8,10,34,.96));border:1px solid var(--line);border-radius:20px;max-width:620px;width:100%;max-height:94vh;overflow:auto;padding:16px 20px 18px;box-shadow:0 0 0 1px rgba(176,107,255,.25),0 0 40px rgba(56,232,255,.22),0 24px 60px rgba(0,0,0,.6);animation:pop .4s cubic-bezier(.2,1.4,.4,1) both;scrollbar-width:thin;scrollbar-color:var(--neon) transparent}
  @keyframes pop{from{transform:translateY(12px) scale(.92);opacity:0}to{transform:none;opacity:1}}
  h1,h2{font-family:Orbitron,"Exo 2",sans-serif;margin:0 0 8px;color:#f2fbff;text-shadow:0 0 6px rgba(56,232,255,.85),0 0 20px rgba(56,232,255,.45),0 0 30px rgba(176,107,255,.4)}
  h1{font-size:1.9rem;letter-spacing:2px;text-align:center}
  h2{font-size:1.15rem;letter-spacing:1px}
  .sub{text-align:center;color:#9fd8ff;margin:-2px 0 10px;font-size:.95rem}
  p{margin:6px 0;line-height:1.45}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .row>.btn{flex:1 1 180px}
  .btn{position:relative;overflow:hidden;font:inherit;font-family:Orbitron,"Exo 2",sans-serif;font-weight:800;letter-spacing:.5px;border:0;border-radius:13px;padding:12px 14px;cursor:pointer;background:linear-gradient(90deg,#ffd84a,#ff9f3c,#ff5fa2,#ffd84a) 0 0/300% 100%;color:#2a1a00;width:100%;margin-top:8px;font-size:.92rem;box-shadow:0 0 16px rgba(255,170,60,.5),inset 0 1px 0 rgba(255,255,255,.6);animation:flow 5s linear infinite;transition:transform .1s}
  .btn:active{transform:scale(.96)}
  .btn.alt{background:rgba(56,232,255,.08);color:var(--neon);border:1px solid var(--line);box-shadow:0 0 12px rgba(56,232,255,.18) inset;animation:none}
  .btn.pink{background:linear-gradient(90deg,#ff4fa3,#b06bff,#ff4fa3) 0 0/300% 100%;color:#fff}
  .btn[disabled]{opacity:.45}
  @keyframes flow{to{background-position:300% 0}}
  .say{display:flex;gap:14px;align-items:center;margin:4px 0 6px;animation:slidein .45s cubic-bezier(.2,1.2,.4,1) both}
  @keyframes slidein{from{transform:translateX(-16px);opacity:0}to{transform:none;opacity:1}}
  .say svg{flex:none;width:76px;height:76px;border-radius:16px;border:2px solid var(--c,var(--neon));box-shadow:0 0 18px var(--c,var(--neon));background:#0a0c26}
  .say .nm{font-family:Orbitron,sans-serif;font-size:.78rem;letter-spacing:2px;color:var(--c,var(--neon));text-shadow:0 0 8px var(--c,var(--neon))}
  .say .tx{font-size:1.08rem;line-height:1.45;font-weight:700}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
  .cd{font:inherit;color:inherit;text-align:center;cursor:pointer;border-radius:14px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(56,232,255,.12),rgba(176,107,255,.08));padding:12px 8px;box-shadow:0 0 14px rgba(56,232,255,.18);animation:pop .4s both;transition:transform .12s,box-shadow .12s}
  .cd:nth-child(2){animation-delay:.08s}.cd:nth-child(3){animation-delay:.16s}
  .cd:hover,.cd:active{transform:translateY(-3px) scale(1.03);box-shadow:0 0 26px rgba(255,216,74,.6);border-color:var(--gold)}
  .cd .ic{font-size:2rem;line-height:1.2}
  .cd b{display:block;font-family:Orbitron,sans-serif;font-size:.78rem;margin:4px 0;color:#fff;text-shadow:0 0 8px var(--neon)}
  .cd small{color:#a9c6e8;font-size:.82rem;line-height:1.3;display:block}
  .cd .lv{color:var(--gold);font-size:.72rem}
  .code{font-family:Orbitron,sans-serif;font-size:2.6rem;letter-spacing:10px;text-align:center;color:#fff;text-shadow:0 0 12px var(--neon),0 0 30px var(--neon2);margin:6px 0}
  input.cin{font-family:Orbitron,sans-serif;font-size:2rem;letter-spacing:10px;text-transform:uppercase;text-align:center;width:100%;padding:10px;border-radius:12px;border:1px solid var(--neon);background:rgba(0,0,0,.35);color:#fff;outline:none;box-shadow:0 0 16px rgba(56,232,255,.35) inset}
  .muted{color:#8fb0d4;font-size:.86rem}
  .keys b{background:rgba(56,232,255,.12);border:1px solid var(--line);color:var(--neon);border-radius:6px;padding:0 6px}
  .card.wide{max-width:860px}
  .pilots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
  .pilots.two{grid-template-columns:1fr 1fr}
  .pilot{font:inherit;color:inherit;cursor:pointer;border-radius:14px;border:2px solid var(--c);background:rgba(0,0,0,.25);padding:10px;box-shadow:0 0 14px var(--c);text-align:center}
  .pilot svg{width:72px;height:72px;border-radius:14px}
  .pilot b{display:block;font-family:Orbitron,sans-serif;color:#fff;text-shadow:0 0 8px var(--c)}
  .pilot small{color:#a9c6e8;font-size:.8rem;line-height:1.25;display:block}
  .spin{display:inline-block;width:18px;height:18px;border:3px solid rgba(56,232,255,.25);border-top-color:var(--neon);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes sp{to{transform:rotate(1turn)}}
  .hb{position:fixed;z-index:4;border:1px solid var(--line);background:rgba(6,8,30,.55);color:var(--neon);font-weight:900;border-radius:12px;height:40px;min-width:40px;padding:0 10px;font-size:16px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);box-shadow:0 0 12px rgba(56,232,255,.35)}
  .hb[hidden]{display:none}
  #pause{top:calc(8px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right))}
  #mute{top:calc(8px + env(safe-area-inset-top));right:calc(58px + env(safe-area-inset-right))}
  .sp{position:fixed;z-index:4;width:clamp(64px,17vmin,92px);height:clamp(64px,17vmin,92px);border-radius:50%;border:2px solid rgba(255,216,74,.8);background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.3),rgba(90,40,10,.35) 70%);color:#fff;font-family:Orbitron,sans-serif;font-size:11px;font-weight:900;letter-spacing:1px;box-shadow:0 0 18px rgba(255,200,80,.6);touch-action:none;display:flex;align-items:center;justify-content:center;flex-direction:column}
  .sp span{font-size:24px;line-height:1}
  .sp[hidden]{display:none}
  .sp.ready{animation:pulse .8s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 34px rgba(255,220,100,1),0 0 70px rgba(255,79,163,.6)}}
  #sp0{left:calc(14px + env(safe-area-inset-left));bottom:calc(14px + env(safe-area-inset-bottom))}
  #sp1{right:calc(14px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom))}
  #rot{position:fixed;inset:0;z-index:9;background:radial-gradient(circle at 50% 30%,#1a2c6a,var(--bg));color:var(--neon);display:none;align-items:center;justify-content:center;text-align:center;padding:24px;font-size:1.2rem}
  @media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
  @media (max-height:520px){.pilots{grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:6px}.pilot{padding:6px}.pilot svg{width:52px;height:52px}.pilot small{font-size:.7rem}.card{padding:12px 16px 14px}h1{font-size:1.5rem}.btn{padding:9px 12px;margin-top:6px}.say svg{width:60px;height:60px}.cd{padding:8px 6px}.cd .ic{font-size:1.6rem}.code{font-size:2rem}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<button class="hb" id="pause" hidden aria-label="Pausar">II</button>
<button class="hb" id="mute" hidden aria-label="Som">🔊</button>
<button class="sp" id="sp0" hidden><span>✦</span>ESPECIAL</button>
<button class="sp" id="sp1" hidden><span>✦</span>ESPECIAL</button>
<div class="ov" id="ov" hidden></div>
<div id="rot"><div><div style="font-size:3rem">📱↻</div>Gire o celular para jogar deitado!</div></div>
<script src="lib/peerjs.min.js"></script>
<script src="neon.js"></script>
</body>
</html>
